<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysterious RP | Police Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-deep: #08090a;
            --panel-bg: rgba(15, 17, 20, 0.85);
            --cyan-primary: #8a7773;
            --cyan-glow: rgba(138, 119, 115, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #71717a;
            --border-color: rgba(138, 119, 115, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(140, 109, 89, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 109, 89, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% -20%, rgba(140, 109, 89, 0.15) 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .rules-container {
            width: 92%; max-width: 1200px; margin: 30px auto;
            display: flex; flex-direction: column; gap: 30px; flex: 1;
        }

        .details-view { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            /* أنيميشن الدخول */
            animation: fadeInUp 0.4s ease forwards;
        }

        /* أنيميشن الخروج النظيف */
        .details-view.fade-out {
            animation: simpleFadeOut 0.3s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes simpleFadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .details-header-flex {
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-left: 3px solid var(--cyan-primary);
            padding: 20px 25px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .details-header-flex h2 {
            font-size: 22px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 12px;
        }
        .details-header-flex h2 i { color: var(--cyan-primary); text-shadow: 0 0 10px var(--cyan-glow); }

        .back-to-dash-btn {
            background: rgba(140, 109, 89, 0.1); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 16px; border-radius: 4px; font-size: 13px;
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
            text-decoration: none; transition: all 0.3s ease;
        }
        .back-to-dash-btn:hover { background: var(--cyan-primary); color: #fff; box-shadow: 0 0 15px var(--cyan-glow); }

        .content-item-box {
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); padding: 30px; position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
        }
        .content-item-box h5 {
            font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 20px;
            padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .question-block {
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .question-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        .question-title { color: #ffb703; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .question-answer { color: #f1f5f9; font-weight: 600; font-size: 14px; line-height: 1.8; white-space: pre-line; }

        .footer-note {
            background: var(--panel-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-right: 3px solid var(--cyan-primary);
            padding: 20px; text-align: center; font-weight: 700; color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        footer {
            text-align: center; padding: 30px; border-top: 1px solid var(--border-color);
            color: var(--text-muted); font-size: 12px; background: rgba(8, 9, 10, 0.95); margin-top: 40px;
        }

        @media (max-width: 768px) {
            .details-header-flex { flex-direction: column; gap: 15px; align-items: flex-start; }
        }

        .btn-discord {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background: #634b3c; 
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(224, 224, 230, 0.3);
        }

        .btn-discord:hover {
            background: #634b3c;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(206, 207, 207, 0.3);
        }
    </style>
</head>
<body>

    <div class="rules-container">
        <div id="sec1" class="details-view">
            <div class="details-header-flex">
                <h2><i class="fa-solid fa-scale-balanced"></i> أسئلة الشرطة</h2>
                <a href="index.html" class="back-to-dash-btn" id="backBtn"><i class="fa-solid fa-arrow-right"></i> <span>العودة</span></a>
            </div>
            
            <div class="content-item-box">
                <h5> </h5>
                <div id="questionsContainer">
                    <!-- سيتم تعبئة الأسئلة تلقائياً من لوحة التحكم -->
                </div>
            </div>
        </div>

    <div class="footer-note">
        <p>لم تجد ما تبحث عنه؟ بإمكانك فتح تذكرة استفسار مباشرة في ديسكورد الشرطة</p>
        <a href="https://discord.gg/bTeJJbNQUQ" target="_blank" class="btn-discord">فتح تذكرة استفسار</a>
    </div>
    </div>

    <footer>
        <span>جميع الحقوق محفوظة © 2026 Mysterious Rp CFW</span> <br>
        <span style="color: var(--text-muted); font-size: 11px; margin-top: 5px; display: inline-block;">تصميم وتطوير النظام بواسطة X.X95</span>
    </footer>

    <script>
        // تفعيل أنيميشن التلاشي عند الضغط على زر العودة
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            const viewSection = document.getElementById('sec1');
            
            viewSection.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        });

        window.onload = function() {
            let questions = JSON.parse(localStorage.getItem('policeQuestionsList'));
            if (!questions) {
                questions = [
                    {
                        q: "1- متى أوقات فتح التقديم على الشرطة؟",
                        a: "يوم ... ويوم ... الساعة .. مساءً."
                    },
                    {
                        q: "2- شروط التقديم العسكري؟",
                        a: "يجب أن يكون عمرك 17 عامًأ فما فوق.\n1- الصوت عامل مهم جدًا في القبول .\n2- الإسم يكون واقعي و باللغة الإنجليزيه مثال ( Fahad alqhtani).\n3- حلق الشعر ( صفر )."
                    },
                    {
                        q: "3- النقل العسكري متواجد؟",
                        a: "نعم"
                    },
                    {
                        q: "4- ماهي شروط النقل؟",
                        a: "الإلمام التام بالقوانين والبروتوكولات المعمول بها داخل المدينة...\nالخبرة المهنية الواسعة في المجال الأمني...\nاجتياز المقابلة الشخصية والاختبار التقييمي."
                    },
                    {
                        q: "5- كيف أقدم على نقل؟",
                        a: "افتح تذكره نقل في دسكورد الشرطة"
                    }
                ];
                localStorage.setItem('policeQuestionsList', JSON.stringify(questions));
            }

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((item, index) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.innerHTML = `
                    <div class="question-title">${item.q}</div>
                    <div class="question-answer">${item.a}</div>
                `;
                container.appendChild(block);
            });
        }
    </script>
</body>
</html>
