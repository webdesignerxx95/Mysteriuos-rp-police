<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysterious RP | Police Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-deep: #08090a;
            --panel-bg: rgba(15, 17, 20, 0.85);
            --cyan-primary: #8a7773;
            --cyan-glow: rgba(138, 119, 115, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #71717a;
            --border-color: rgba(138, 119, 115, 0.2);
            --red-alert: #992424;
            --gold-alert: #adaf0f;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(140, 109, 89, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 109, 89, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% -20%, rgba(140, 109, 89, 0.15) 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Container */
        .rules-container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            animation: fadeInUp 0.8s ease-out;
        }

        .details-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .details-header-flex {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--cyan-primary);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeInDown 0.8s ease-out;
        }

        .details-header-flex h2 {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .details-header-flex h2 i {
            color: var(--cyan-primary);
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        .back-to-dash-btn {
            background: rgba(140, 109, 89, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-to-dash-btn:hover {
            background: var(--cyan-primary);
            color: #fff;
            box-shadow: 0 0 15px var(--cyan-glow);
            transform: translateY(-2px);
        }

        /* Content Boxes */
        .content-item-box, .card {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            border-radius: 8px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .content-item-box:hover, .card:hover {
            border-color: rgba(138, 119, 115, 0.4);
            transform: translateY(-3px);
        }

        .content-item-box::before, .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 10px; height: 10px;
            border-top: 2px solid var(--cyan-primary);
            border-left: 2px solid var(--cyan-primary);
        }
        .content-item-box::after, .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 10px; height: 10px;
            border-bottom: 2px solid var(--cyan-primary);
            border-right: 2px solid var(--cyan-primary);
        }

        .container h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        iframe { 
            width: 100%; 
            border: none; 
            border-radius: 8px; 
            min-height: 700px; 
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            background: rgba(8, 9, 10, 0.95);
            margin-top: 40px;
            animation: fadeInDown 1s ease-out;
        }

        @media (max-width: 768px) {
            .details-header-flex {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="rules-container">

        <div id="sec1" class="details-view">
            <div class="details-header-flex">
                <h2 data-en="Military Ranks"><i class="fa-solid fa-star"></i> 9. الجدول العسكري  </h2>
                <a href="index.html" class="back-to-dash-btn"><i class="fa-solid fa-arrow-right"></i> <span data-en="Back">العودة</span></a>
            </div>
            
            <div class="container">
                <h1 data-ar="الجدول العسكري | Department Schedule" data-en="Department Schedule">الجدول العسكري | Department Schedule</h1>
                <div class="card">
                    <iframe src="https://docs.google.com/spreadsheets/d/1TgmEW_E8qtEqb09iu5C8SBrzg2RyOzETR7XJugqWB7w/edit?gid=1544839770#gid=1544839770"></iframe>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <span data-ar="جميع الحقوق محفوظة © 2026 Mysterious Rp CFW" data-en="Copyright © 2026 Mysterious Rp CFW. All Rights Reserved.">جميع الحقوق محفوظة © 2026 Mysterious Rp CFW</span> <br>
        <span style="color: var(--text-muted); font-size: 11px; margin-top: 5px; display: inline-block;" data-ar="تصميم وتطوير النظام بواسطة X.X95" data-en="System Architecture & Design by X.X95">تصميم وتطوير النظام بواسطة X.X95</span>
    </footer>

    <script>
        let currentLang = 'ar';

        function toggleLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langText = document.getElementById('langText');
            const elements = document.querySelectorAll('[data-ar][data-en]');

            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                if(langText) langText.textContent = 'AR';

                elements.forEach(el => {
                    el.textContent = el.getAttribute('data-en');
                });
            } else {
                currentLang = 'ar';
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                if(langText) langText.textContent = 'EN';

                elements.forEach(el => {
                    el.textContent = el.getAttribute('data-ar');
                });
            }
        }
    </script>

</body>
</html>
